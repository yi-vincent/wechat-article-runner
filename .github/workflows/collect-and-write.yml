name: Collect and write

# 本仓库是公开的，只放这一个 workflow；内容全在私有仓库（vars.CONTENT_REPO）。
# 运行时用 CONTENT_REPO_TOKEN checkout 私有仓库 → 采集 → OpenCode 写稿 → 校验 → 向私有仓库开 PR 并合并。
#
# 公开仓库的日志与 artifact 谁都能看，所以：
#   - 会打印正文/文件名的命令，输出一律重定向到 $PRIV（runner 临时目录），日志里只写通过/失败；
#   - artifact 用 ARTIFACT_PASSPHRASE 加密后才上传，没配口令就不上传；
#   - 只允许 workflow_dispatch 触发，不接任何 PR 事件（fork 拿不到 secrets，也碰不到这里）。
# 禁止 wewrite publish。

on:
  # 不用 GitHub schedule（实测延迟 2–5 小时，高负载时整次跳过）。
  # 由国内服务器按私有仓库 config/schedule.yaml 的时间（当前北京时间 07:00）调 API 触发（pipeline/daily_ops.py tick）。
  # 没有 schedule 也就不受「公开仓库 60 天无提交停用 schedule」的影响，不再需要 keepalive。
  workflow_dispatch:
    inputs:
      fetch_only:
        description: "只抓材料不写稿：结果只进加密 artifact，不建分支"
        type: boolean
        default: false
      news_id:
        description: "指定 Wowhead 新闻 ID，多条用逗号分隔（可选）"
        type: string
        default: ""
      limit:
        description: "本轮最多写几篇；留空 = 用仓库 Variables 的 MAX_ARTICLES；0 = 未用的全部写完"
        type: string
        # 必须留空：服务器 dispatch 传 limit="" 时 GitHub 会套用这里的默认值，写 "1" 就每天只写 1 篇
        default: ""
      no_pr:
        description: "只跑不交付：不推 auto/ 分支、不开 PR（结果在加密 artifact 里）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-and-write
  cancel-in-progress: false

jobs:
  collect-write:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CONTENT_REPO: ${{ vars.CONTENT_REPO }}
      FETCH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_only || false }}
      NO_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.no_pr || false }}
      NEWS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.news_id || '' }}
      MAX_ARTICLES: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || vars.MAX_ARTICLES || '5' }}
      WEWRITE_HOME: ${{ github.workspace }}/.wewrite
    steps:
      - name: Preflight
        id: preflight
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          set -euo pipefail
          PRIV="${RUNNER_TEMP}/private"
          mkdir -p "$PRIV"
          date +%s > "$PRIV/t0"   # 通知里的用时
          miss=""
          [ -n "${CONTENT_REPO}" ] || miss="$miss vars.CONTENT_REPO"
          [ -n "${TOKEN}" ] || miss="$miss secrets.CONTENT_REPO_TOKEN"
          if [ "${FETCH_ONLY}" != "true" ] && [ -z "${ZHIPU_API_KEY}" ]; then miss="$miss secrets.ZHIPU_API_KEY"; fi
          if [ -n "$miss" ]; then
            echo "缺少配置：$miss（runner 仓库 Settings → Secrets and variables → Actions）" > "$PRIV/preflight.log"
            echo "::error::缺少配置：$miss（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "PRIV=${PRIV}" >> "$GITHUB_ENV"

      - name: Checkout content repo
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
          # 不把 token 留在 .git/config 里：写稿 agent 在这个目录里跑，推送时再临时带上
          persist-credentials: false

      - name: Create auto branch
        id: branch
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Shanghai date +%F)
          BR="auto/${DAY}"
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${CONTENT_REPO}.git" "$BR" >/dev/null 2>&1; then
            BR="auto/${DAY}-r${{ github.run_number }}"
          fi
          git checkout -q -b "$BR"
          echo "DAY=${DAY}" >> "$GITHUB_ENV"
          echo "AUTO_BRANCH=${BR}" >> "$GITHUB_ENV"
          echo "base main=$(git rev-parse --short HEAD) → ${BR}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        id: deps
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          pip install -q -r pipeline/requirements.txt
          if [ "${FETCH_ONLY}" != "true" ]; then
            pip install -q wewrite
            H="${WEWRITE_HOME}"
            mkdir -p "$H/themes" "$H/corpus" "$H/lessons"
            ln -sf "${GITHUB_WORKSPACE}/config/style.yaml" "$H/style.yaml"
            ln -sf "${GITHUB_WORKSPACE}/config/wow-theme.yaml" "$H/themes/wow-theme.yaml"
            [ -f "$H/history.yaml" ] || printf 'version: 1\narticles: []\n' > "$H/history.yaml"
            { wewrite home; wewrite diagnose --json || true; } > "$PRIV/install.log" 2>&1
          fi
          echo "依赖已装好"

      - name: Fetch materials (no writing)
        id: fetch
        if: env.FETCH_ONLY == 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          WM_MODEL: ${{ vars.WM_MODEL || 'glm-5.3-flash' }}
          WM_MODE: ${{ vars.WM_MODE || 'mosaic' }}
        run: |
          set -euo pipefail
          rc=0
          {
            python articles/wh_fetch.py list --category Forever --json
            python pipeline/fetch_materials.py --limit "${MAX_ARTICLES}"
          } > "$PRIV/fetch.log" 2>&1 || rc=$?
          # 抓材料模式也过一遍水印检测，方便在 artifact 里看效果；没配 Key 就跳过
          if [ -n "${ZHIPU_API_KEY}" ] && [ -d pipeline/materials ] && [ -f pipeline/wm_scrub.py ]; then
            WM_ORIG_DIR="$PRIV/wm-orig" python pipeline/wm_scrub.py --dir pipeline/materials > "$PRIV/watermark.log" 2>&1 || true
            echo "水印：$(tail -n 1 "$PRIV/watermark.log")"
          fi
          echo "### 抓材料结束（退出码 $rc），结果在加密 artifact 里" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: CN official channel (wow.blizzard.cn)
        id: cn
        # 国服官网是信源第一位，不能只靠 agent 自觉去查：这里固定先跑一遍，结果写进公开 Summary。
        # 官网新闻本来就是公开内容，标题/ID 进公开日志没问题。抓不到（境外 IP 被拦、改版）直接报错，不静默跑空。
        run: |
          set -uo pipefail
          {
            echo "### 国服官网（wow.blizzard.cn/news）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if out=$(python articles/bz_fetch.py list --keyword "" --all --limit 25 2>&1); then
            echo "$out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            UNUSED=$(python articles/bz_fetch.py list --json | python -c "import json,sys; print(len(json.load(sys.stdin)))")
            echo "「无限」未用：${UNUSED} 条" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "国服官网：「无限」未用 ${UNUSED} 条" > "$PRIV/cn_summary.txt"
          else
            echo "$out" > "$PRIV/cn.log"
            echo "$out" | tail -5 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::国服官网抓取失败，本轮缺官方通道，不继续写稿"
            exit 1
          fi

      - name: Install OpenCode CLI
        id: opencode_install
        if: env.FETCH_ONLY != 'true'
        run: |
          curl -fsSL https://opencode.ai/install | bash > "$PRIV/opencode-install.log" 2>&1
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: WeChat radar (Wechat2RSS, last 2 days)
        id: radar
        if: env.FETCH_ONLY != 'true'
        # 国内公众号雷达（私有仓库 articles/wx_fetch.py）：只拉最近 2 天，各号转的同一条新闻合并成事件，写过的自动排除；
        # 配图过视觉模型判水印（pipeline/wx_wm.py）。雷达账本 articles/wx_events.json 随本轮 PR 一起提交。
        # 公众号标题 / 链接只进 $PRIV（加密 artifact），公开日志只写数字。
        # 雷达挂了不拦写稿：没配 secrets、同步失败都跳过，这一轮只用官网和 Wowhead。
        continue-on-error: true
        timeout-minutes: 20
        env:
          WX2RSS_URL: ${{ secrets.WX2RSS_URL }}
          WX2RSS_TOKEN: ${{ secrets.WX2RSS_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          WM_MODEL: ${{ vars.WM_MODEL || 'glm-5.3-flash' }}
          WX_CACHE: ${{ runner.temp }}/wx-cache
        run: |
          set -uo pipefail
          if [ ! -f articles/wx_fetch.py ]; then echo "内容仓库还没有 wx_fetch.py，跳过"; exit 0; fi
          if [ -z "${WX2RSS_URL}" ] || [ -z "${WX2RSS_TOKEN}" ]; then
            echo "::warning::没配 secrets.WX2RSS_URL / WX2RSS_TOKEN，本轮跳过公众号雷达"
            exit 0
          fi
          rc=0
          python articles/wx_fetch.py sync > "$PRIV/wx_radar.log" 2>&1 || rc=$?
          if [ $rc -ne 0 ]; then
            git checkout -q -- articles/wx_events.json 2>/dev/null || rm -f articles/wx_events.json
            echo "公众号雷达同步失败（退出码 $rc），本轮只用官网和 Wowhead" > "$PRIV/radar_fail.txt"
            echo "::warning::公众号雷达同步失败（退出码 $rc），本轮只用官网和 Wowhead；详情见加密 artifact 里的 wx_radar.log"
            exit 0
          fi
          WM_DEADLINE=600 python pipeline/wx_wm.py >> "$PRIV/wx_radar.log" 2>&1 || true
          python articles/wx_fetch.py todo > "$PRIV/wx_todo.txt" 2>&1 || true
          python articles/wx_fetch.py todo --json > "$PRIV/wx_todo.json" 2>/dev/null || true
          python - "$PRIV/wx_todo.json" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          sys.path.insert(0, "articles")
          try:
              import versions as V   # 要处理的版本（私有仓库 config/versions.yaml：无限 / 正式服 / 经典60 + 版本待定的综合）
              want = V.todo_versions()
          except Exception:
              want = ["无限"]
          ev = [e for e in json.load(open("articles/wx_events.json", encoding="utf-8"))["events"] if e["ver"] in want]
          try:
              todo = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              todo = None
          used = sum(1 for e in ev if e.get("used"))
          by = {}
          for e in todo or []:
              by[e["ver"]] = by.get(e["ver"], 0) + 1
          detail = " / ".join(f"{v} {by[v]}" for v in want if by.get(v))
          print(f"公众号雷达：最近 2 天要处理的事件 {len(ev)} 个，写过自动排除 {used} 个，"
                f"待 agent 处理 {len(todo) if todo is not None else '?'} 个" + (f"（{detail}）" if detail else ""))
          EOF
          tail -n 1 "$GITHUB_STEP_SUMMARY" > "$PRIV/radar_summary.txt"

      - name: NGA hot threads (clues)
        id: nga
        if: env.FETCH_ONLY != 'true'
        # NGA 讨论热帖（私有仓库 articles/nga_hot.py）：读私有仓库 wow-news-collector 每小时记的回复数快照，
        # 取过去 24 小时新增回复最多的帖，存进 .wewrite/nga-hot.json 给 agent 当线索（追原始出处，不当信源）。
        # 读那个仓库用 NGA_REPO_TOKEN（fine-grained PAT，只授权 wow-news-collector，Contents: Read）；
        # 没配就试 CONTENT_REPO_TOKEN（得把 wow-news-collector 也加进它的授权）。
        # 帖子标题只进 $PRIV，公开日志只写数字。取不到就跳过，不拦写稿。
        continue-on-error: true
        timeout-minutes: 5
        env:
          NGA_REPO_TOKEN: ${{ secrets.NGA_REPO_TOKEN || secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f articles/nga_hot.py ]; then echo "内容仓库还没有 nga_hot.py，跳过"; exit 0; fi
          if python articles/nga_hot.py sync > "$PRIV/nga.log" 2>&1; then
            tail -n 1 "$PRIV/nga.log" | tee -a "$GITHUB_STEP_SUMMARY"
            cp .wewrite/nga-hot.json "$PRIV/" 2>/dev/null || true
          else
            echo "::warning::NGA 热帖快照取不到（没配 secrets.NGA_REPO_TOKEN，或 token 读不了 wow-news-collector），本轮不看 NGA；详情见加密 artifact 里的 nga.log"
            echo "NGA 热帖：取不到快照，本轮跳过" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wowhead and official site to-do (by version)
        id: channels
        if: env.FETCH_ONLY != 'true'
        # 三条通道都按版本列待处理（私有仓库 config/versions.yaml：无限 / 正式服 / 经典60 + 源头判不出版本的综合），agent 收尾前都要清零。
        # Wowhead、国服官网的新闻是公开内容，标题进公开 Summary 没问题。抓不到不拦写稿：agent 自己还会再拉一遍。
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ ! -f articles/versions.py ]; then echo "内容仓库还没有按版本分的 todo，跳过"; exit 0; fi
          echo "### Wowhead / 国服官网：按版本的待处理" >> "$GITHUB_STEP_SUMMARY"
          for ch in wh bz; do
            python articles/${ch}_fetch.py todo > "$PRIV/${ch}_todo.txt" 2>&1 || true
            if python articles/${ch}_fetch.py todo --json > "$PRIV/${ch}_todo.json" 2>/dev/null || \
               python -c 'import json,sys; json.load(open(sys.argv[1]))' "$PRIV/${ch}_todo.json" 2>/dev/null; then
              { echo '```'; cat "$PRIV/${ch}_todo.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::${ch}_fetch.py todo 出错，本轮这条通道交给 agent 自己拉；详情见加密 artifact 里的 ${ch}_todo.txt"
              echo "${ch}_fetch.py todo 出错（详情在加密 artifact）" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: OpenCode agent
        id: agent
        if: env.FETCH_ONLY != 'true'
        timeout-minutes: 150
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENCODE_MODEL: ${{ vars.ZHIPU_OPENCODE_MODEL || 'zhipu/glm-5.3-flash' }}
          # 雷达那一步把公众号全文缓存在这里，agent 调 wx_fetch.py get 读缓存（不给 agent WX2RSS token）
          WX_CACHE: ${{ runner.temp }}/wx-cache
          PROMPT: |
            按仓库 pipeline/gha-agent-brief.md 执行 WeWrite 写稿。

            本轮：NEWS_ID=${{ env.NEWS_ID }}  MAX_ARTICLES=${{ env.MAX_ARTICLES }}  日期=${{ env.DAY }}

            先 Read pipeline/gha-agent-brief.md 和 skills/wewrite/SKILL.md。
            wewrite 的 {home} = $WEWRITE_HOME = 仓库内 .wewrite/（style.yaml 已就位，来自 config/style.yaml），不要去 ~/.wewrite，不要走 onboard。
            临时文件放 pipeline/runs/ 或 .wewrite/ 下，不要写仓库外的目录。
            选题三条通道都用 todo 逐条处理（版本：无限 / 正式服 / 经典60，外加源头判不出版本的「综合」，见 brief「内容版本」）：
            articles/bz_fetch.py todo（官方站，优先）、articles/wh_fetch.py todo（Wowhead 新闻 + 蓝帖）、articles/wx_fetch.py todo（公众号雷达，写过的已自动排除）；
            另有 articles/nga_hot.py todo（NGA 讨论热帖，只当线索：追到原始出处才写，见 brief ④）。
            每条都要有着落：写进稿子 / 并进别篇 / 跳过（bz_fetch.py、wh_fetch.py、wx_fetch.py、nga_hot.py 各自的 mark 登记），收尾前四个 todo 都为 0。
            取不到全文等工具问题不要 mark，名额用完还值得写的也不要 mark，留到下一轮并在最终回复里写明。
            篇数：无限最多 MAX_ARTICLES 篇；正式服 + 经典60 另加最多 2 篇（config/versions.yaml 的 caps.others）。一篇只写一个版本，used_news 记 version。
            公众号内容只当线索，按 brief 追原始出处。不要用 websearch。
            禁止 wewrite publish。四个 todo 都为 0 就结束，不要改无关文件。
            只改工作区文件：articles/、pipeline/pending_publish.yaml、pipeline/runs/。articles/wx_events.json 是雷达账本，不要改。
            不要 git commit、不要 git push、不要开 PR；提交由后面的 workflow step 做。
        run: |
          set -euo pipefail
          opencode --version
          rc=0
          opencode run --model "${OPENCODE_MODEL}" --print-logs "${PROMPT}" > "$PRIV/opencode.log" 2>&1 || rc=$?
          echo "opencode 退出码 $rc，日志 $(wc -l < "$PRIV/opencode.log") 行（在加密 artifact 里）"
          exit $rc

      - name: Scrub watermarks
        id: wm
        if: env.FETCH_ONLY != 'true'
        # 图片处理失败绝不拦流程：出错 / 超时都继续往下走，没处理成的图就用原图
        continue-on-error: true
        timeout-minutes: 15
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          WM_MODEL: ${{ vars.WM_MODEL || 'glm-5.3-flash' }}
          WM_MODE: ${{ vars.WM_MODE || 'mosaic' }}
        run: |
          # 视觉模型检测本轮新增/改动的 articles/images/*，有网站水印（Wowhead 爪子 logo）就打码或裁底。
          # 逐张结果含文件名，只进 watermark.log；公开日志只留汇总行。原图进 $PRIV/wm-orig（随加密 artifact）。
          # 失败不拦流程：单张失败用原图；脚本退出码恒为 0；总时限 WM_DEADLINE（10 分钟）到了剩下的用原图。
          set -uo pipefail
          trap 'find articles/images -name "*.wmtmp" -delete 2>/dev/null; true' EXIT
          if [ ! -f pipeline/wm_scrub.py ]; then echo "内容仓库还没有 wm_scrub.py，跳过"; exit 0; fi
          WM_ORIG_DIR="$PRIV/wm-orig" WM_DEADLINE=600 python pipeline/wm_scrub.py --changed > "$PRIV/watermark.log" 2>&1 || true
          echo "水印：$(tail -n 1 "$PRIV/watermark.log" 2>/dev/null)"
          if grep -q '^\[error\]' "$PRIV/watermark.log" 2>/dev/null; then
            echo "::warning::部分图片水印处理失败，已用原图（可能仍带水印），详情见加密 artifact 里的 watermark.log"
          fi
          exit 0

      - name: Gate - paths and article checks
        id: gate
        if: env.FETCH_ONLY != 'true'
        run: |
          find articles/images -name "*.wmtmp" -delete 2>/dev/null || true
          # 闸门逻辑与此前在私有仓库时相同；输出含文件名和正文片段，全部进 gate.log
          # 公开日志只写卡在哪一项（gate_step.txt），具体文件名与正文仍只进 gate.log
          bash -euo pipefail > "$PRIV/gate.log" 2>&1 <<'GATE' || { echo "::error::闸门未过：$(cat "$PRIV/gate_step.txt" 2>/dev/null || echo 未知)。不开 PR，详情见加密 artifact 里的 gate.log"; exit 1; }
          # 1) 只允许动这三处
          BAD=$(git -c core.quotepath=off status --porcelain --untracked-files=all \
            | awk '{print $NF}' \
            | grep -vE '^(articles/|pipeline/pending_publish\.yaml$|pipeline/runs/)' || true)
          if [ -n "$BAD" ]; then
            # 只记顶层目录（如 tools/、AGENTS.md），不暴露完整文件名
            echo "1-改动越界：$(echo "$BAD" | cut -d/ -f1 | sort -u | tr '\n' ' ')" > "$PRIV/gate_step.txt"
            echo "Agent 改动了允许范围以外的文件："
            echo "$BAD"
            exit 1
          fi
          # 2) 安全闸不许被打开
          if grep -qE '^auto_publish:\s*true' pipeline/pending_publish.yaml; then
            echo "2-auto_publish 被打开" > "$PRIV/gate_step.txt"
            echo "pending_publish.yaml 的 auto_publish 被改成了 true"
            exit 1
          fi
          # 3) 待推队列的摘要不超过 120 字（按字数，不是字节）
          echo "3-摘要超过 120 字" > "$PRIV/gate_step.txt"
          python3 - <<'EOF'
          import sys, yaml
          d = yaml.safe_load(open("pipeline/pending_publish.yaml", encoding="utf-8")) or {}
          bad = [(i.get("series_no"), len(i.get("digest") or "")) for i in d.get("items") or []
                 if len(i.get("digest") or "") > 120]
          for no, n in bad:
              print(f"第 {no} 篇摘要 {n} 字，超过 120 字")
          sys.exit(1 if bad else 0)
          EOF
          # 4) 新成稿逐篇过审核脚本（不信 Agent 自报）
          NEW=$(git ls-files --others --exclude-standard 'articles/[0-9][0-9]*-*.md' || true)
          # 不写进 $GITHUB_ENV：那里的变量会在后续每个步骤开头打印到公开日志
          echo "$NEW" > "$PRIV/new_articles.txt"
          if [ -z "$NEW" ]; then
            echo "没有新成稿"
            exit 0
          fi
          echo "4-lint 未过" > "$PRIV/gate_step.txt"
          python3 tools/lint.py --changed
          GATE
          echo "闸门通过"
          # 公众号雷达还剩几个事件 agent 没处理：只提醒、不拦 PR（拦了会连同已写好的稿一起丢），下一轮还会列出来
          if [ -f articles/wx_fetch.py ] && [ -f articles/wx_events.json ]; then
            python articles/wx_fetch.py todo --json > "$PRIV/wx_todo_after.json" 2>/dev/null || true
            LEFT=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$PRIV/wx_todo_after.json" 2>/dev/null || echo "?")
            if [ "$LEFT" != "0" ]; then
              echo "公众号雷达还有 ${LEFT} 个事件 agent 没处理（不拦 PR，下一轮还会列出来）" > "$PRIV/radar_left.txt"
              echo "::warning::公众号雷达还有 ${LEFT} 个事件 agent 没处理（不拦 PR，下一轮还会列出来）"
              echo "公众号雷达：收尾时还有 ${LEFT} 个事件没处理" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # NGA 热帖线索还剩几帖没处理（只提醒、不拦 PR）
          if [ -f articles/nga_hot.py ]; then
            python articles/nga_hot.py todo --json > "$PRIV/nga_todo_after.json" 2>/dev/null || true
            LEFT=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$PRIV/nga_todo_after.json" 2>/dev/null || echo "?")
            if [ "$LEFT" != "0" ]; then
              echo "::warning::NGA 热帖还有 ${LEFT} 帖 agent 没处理（不拦 PR）"
              echo "NGA 热帖：收尾时还有 ${LEFT} 帖没处理" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Wowhead（含蓝帖）、国服官网还剩几条没处理（同样只提醒、不拦 PR；名额用完留到下一轮的也算在里面）
          if [ -f articles/versions.py ]; then
            for ch in wh bz; do
              python articles/${ch}_fetch.py todo --json > "$PRIV/${ch}_todo_after.json" 2>/dev/null || true
              LEFT=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$PRIV/${ch}_todo_after.json" 2>/dev/null || echo "?")
              NAME=$([ "$ch" = wh ] && echo Wowhead || echo 国服官网)
              if [ "$LEFT" != "0" ]; then
                echo "::warning::${NAME}还有 ${LEFT} 条 agent 没处理（不拦 PR，下一轮还会列出来）"
                echo "${NAME}：收尾时还有 ${LEFT} 条没处理" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi

      - name: Encrypt and upload artifact
        if: always()
        env:
          PASS: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -uo pipefail
          if [ -z "${PASS}" ]; then
            echo "::warning::未配置 ARTIFACT_PASSPHRASE，跳过 artifact（公开仓库不上传明文）"
            exit 0
          fi
          cd "${GITHUB_WORKSPACE}" 2>/dev/null || exit 0
          mkdir -p _bundle
          [ -d "$PRIV" ] && cp -r "$PRIV" _bundle/logs
          # 只打包本轮新增/改动的文件（整个 articles/images 有几十 MB），外加抓材料目录和写稿临时文件
          # （两者都在内容仓库的 .gitignore 里，git status 看不到，要单独加）
          git -c core.quotepath=off status --porcelain --untracked-files=all \
            | awk '$1 != "D" && $NF !~ /^_bundle\// {print $NF}' > _bundle/changed.txt
          echo _bundle > "${RUNNER_TEMP}/tarlist"
          cat _bundle/changed.txt >> "${RUNNER_TEMP}/tarlist"
          [ -d pipeline/materials ] && echo pipeline/materials >> "${RUNNER_TEMP}/tarlist"
          [ -d pipeline/runs ] && echo pipeline/runs >> "${RUNNER_TEMP}/tarlist"
          mkdir -p "${RUNNER_TEMP}/out"
          tar czf - -T "${RUNNER_TEMP}/tarlist" 2>/dev/null \
            | openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:PASS \
              -out "${RUNNER_TEMP}/out/run-${{ github.run_number }}.tar.gz.enc"
          rm -rf _bundle
          echo "已加密：$(du -h "${RUNNER_TEMP}/out/run-${{ github.run_number }}.tar.gz.enc" | cut -f1)"

      - name: Upload encrypted artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_number }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Push auto branch and open PR
        id: pr
        if: env.FETCH_ONLY != 'true' && env.NO_PR != 'true'
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          NEW_ARTICLES=$(cat "$PRIV/new_articles.txt" 2>/dev/null || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $NEW_ARTICLES; do
            # 按 - 切出序号：cut -c1-2 会把 110-xxx.md 记成 11（#100 起的事件日志都错了）
            no=$(basename "$f" | cut -d- -f1 | sed 's/^0*//')
            python3 pipeline/eventlog.py --actor gha --run-id "${{ github.run_id }}" \
              --stage written --series "$no" \
              --field model="${{ vars.ZHIPU_OPENCODE_MODEL || 'zhipu/glm-5.3-flash' }}" \
              --field file="$(basename "$f")" --field branch="${AUTO_BRANCH}" --field checks=pass \
              >/dev/null
          done
          # 账本 JSON 统一成服务器写的格式（indent=2、中文不转义）：agent 换了缩进会让整份文件进 diff
          # （run 30 用 1 格缩进重写了 source_links.json，PR 多出 6000 多行，服务器推草稿时又改回来一遍）
          python3 - <<'EOF' || true
          import json, pathlib
          p = pathlib.Path("articles/source_links.json")
          if p.exists():
              p.write_text(json.dumps(json.loads(p.read_text(encoding="utf-8")), ensure_ascii=False, indent=2) + "\n",
                           encoding="utf-8")
          EOF
          # pipeline/runs 是写稿临时文件，不入库（2026-10-08），只进上面的加密 artifact
          for pth in articles pipeline/pending_publish.yaml pipeline/events; do
            [ -e "$pth" ] && git add "$pth"
          done
          if git diff --cached --quiet; then
            echo "### 本轮没有新成稿，未建分支" >> "$GITHUB_STEP_SUMMARY"
            echo nothing > "$PRIV/merge_state"
            exit 0
          fi
          LIST=$(echo "$NEW_ARTICLES" | sed '/^$/d; s#^articles/#- #')
          # 没有新稿时（只有公众号雷达账本 / 处理记录变了）标题写明，别叫「新成稿」
          if [ -n "$LIST" ]; then KIND="新成稿"; else KIND="雷达账本（无新稿）"; fi
          git commit -q -m "auto: ${DAY} ${KIND}（run ${{ github.run_number }}）"
          git push -q "https://x-access-token:${TOKEN}@github.com/${CONTENT_REPO}.git" "HEAD:${AUTO_BRANCH}" 2>"$PRIV/push.err"
          # 人审清单只给本轮新稿；$NEW_ARTICLES 为空时 lint 会把全部旧稿的清单都列出来（run 29 的 PR 就这样被撑长）
          CHECKLIST=""
          if [ -n "$LIST" ]; then
            CHECKLIST=$(python3 tools/lint.py $NEW_ARTICLES --checklist 2>/dev/null || true)
          fi
          # 公众号雷达：本轮 agent 对每个事件怎么处理的（成篇 / 速递 / 跳过 + 理由）。PR 在私有仓库，标题可以写进来
          RADAR=""
          if [ -f articles/wx_handled.yaml ]; then
            RADAR=$(python3 - 2>/dev/null <<'EOF' || true
          import collections, subprocess, yaml
          def load(txt):
              return (yaml.safe_load(txt) or {}).get("handled") or []
          try:
              base = load(subprocess.run(["git", "show", "HEAD~1:articles/wx_handled.yaml"],
                                         capture_output=True, text=True, check=True).stdout)
          except Exception:
              base = []
          seen = {(r.get("event"), r.get("at")) for r in base}
          new = [r for r in load(open("articles/wx_handled.yaml", encoding="utf-8").read())
                 if (r.get("event"), r.get("at")) not in seen]
          if new:
              c = collections.Counter(r.get("how") for r in new)
              print("### 公众号雷达：本轮处理 %d 个事件（单独成篇 %d / 并进速递 %d / 跳过 %d）"
                    % (len(new), c["written"], c["digest"], c["skip"]))
              for r in new:
                  how = {"written": "成篇 #%s" % r.get("no"), "digest": "速递 #%s" % r.get("no")}.get(r.get("how"), "跳过")
                  print("- %s ｜ %s%s" % (r.get("title"), how, "：" + r["why"] if r.get("why") else ""))
          EOF
          )
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "OpenCode 自动成稿，已过 tools/lint.py（规则见 rules/registry.yaml）。运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${LIST:-（无新稿，只有公众号雷达账本 / 处理记录）}" \
            "${RADAR}" \
            "${CHECKLIST}" \
            "本 PR 由 workflow 自动合并（机器闸门已过）。上面的人审项是事后复查清单——发现问题在 main 上改，或 revert 本次 squash commit。")
          if URL=$(gh pr create --repo "${CONTENT_REPO}" --base main --head "${AUTO_BRANCH}" \
                --title "auto: ${DAY} ${KIND}" --body "$BODY" 2>"$PRIV/pr.err"); then
            echo "### PR：${URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" > "$PRIV/pr_url.txt"
            if gh pr merge "$URL" --repo "${CONTENT_REPO}" --squash --delete-branch \
                 --subject "auto: ${DAY} ${KIND}（run ${{ github.run_number }}）" >/dev/null 2>>"$PRIV/pr.err"; then
              echo merged > "$PRIV/merge_state"
              echo "### 已自动合并到 main" >> "$GITHUB_STEP_SUMMARY"
            else
              echo failed > "$PRIV/merge_state"
              echo "::warning::自动合并失败（多半是冲突或序号撞号），PR 留着人工处理：${URL}"
            fi
          else
            echo "::warning::自动开 PR 失败，分支 ${AUTO_BRANCH} 已推到私有仓库，请手动开 PR"
            exit 1
          fi

      # 每轮都推一张企业微信卡片（secrets.NOTIFY_WEBHOOK = 自建 Message Pusher 的 webhook 地址；卡片放概况和失败项，点详情看完整内容）：
      #   ✅ 成功：新稿篇目和标题、PR、合并没有，外加官网 / 公众号雷达概况；没有新稿也报一声
      #   ⚠️ 跑完了但有提醒：自动合并失败、雷达同步失败或没处理完、水印处理出错
      #   ❌ 失败：卡在哪一步，外加那一步日志的末尾 200 行
      # 标题、日志都在 $PRIV，只进企业微信，不进公开日志。消息用私有仓库 HEAD 上的 pipeline/notify.py
      # （git show，不跑 agent 可能动过的工作区版本）；checkout 都失败了就没有脚本，退回 curl 发一行纯文本。
      # 推送失败只记警告，不影响本次运行结果。
      - name: Notify WeCom
        if: always()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          S_PREFLIGHT: ${{ steps.preflight.outcome }}
          S_CHECKOUT: ${{ steps.checkout.outcome }}
          S_BRANCH: ${{ steps.branch.outcome }}
          S_DEPS: ${{ steps.deps.outcome }}
          S_FETCH: ${{ steps.fetch.outcome }}
          S_CN: ${{ steps.cn.outcome }}
          S_OC_INSTALL: ${{ steps.opencode_install.outcome }}
          S_RADAR: ${{ steps.radar.outcome }}
          S_AGENT: ${{ steps.agent.outcome }}
          S_WM: ${{ steps.wm.outcome }}
          S_GATE: ${{ steps.gate.outcome }}
          S_PR: ${{ steps.pr.outcome }}
        run: |
          set +e -uo pipefail
          if [ -z "${NOTIFY_WEBHOOK}" ]; then
            echo "::warning::未配置 NOTIFY_WEBHOOK，本轮结果没推企业微信"
            exit 0
          fi
          PRIV="${PRIV:-${RUNNER_TEMP}/private}"
          N="${RUNNER_TEMP}/notify"
          mkdir -p "$PRIV" "$N"
          ITEMS=(); FAILS=(); WARNS=()
          # 记一条失败 / 提醒：第一行标题（卡片里加粗），后面接相关日志的末尾
          item() {  # item fail|warn 键 标题 [日志…]
            local kind="$1" key="$2" title="$3" f; shift 3
            f="$N/$kind-$key.txt"
            { echo "$title"; for x in "$@"; do [ -s "$x" ] && tail -n 200 "$x"; done; } > "$f"
            if [ "$kind" = fail ]; then FAILS+=("$title"); else WARNS+=("$title"); fi
            ITEMS+=(--fail "$f")
          }
          [ "$S_PREFLIGHT" = failure ] && item fail preflight "✗ 配置缺失" "$PRIV/preflight.log"
          [ "$S_CHECKOUT" = failure ] && item fail checkout "✗ checkout 私有仓库失败（CONTENT_REPO_TOKEN 过期或没权限？）"
          [ "$S_BRANCH" = failure ] && item fail branch "✗ 建 auto 分支失败"
          [ "$S_DEPS" = failure ] && item fail deps "✗ 装依赖失败" "$PRIV/install.log"
          [ "$S_FETCH" = failure ] && item fail fetch "✗ 抓材料失败" "$PRIV/fetch.log"
          [ "$S_CN" = failure ] && item fail cn "✗ 国服官网抓取失败，本轮没写稿" "$PRIV/cn.log"
          [ "$S_OC_INSTALL" = failure ] && item fail oc_install "✗ 安装 OpenCode 失败" "$PRIV/opencode-install.log"
          [ "$S_AGENT" = failure ] && item fail agent "✗ OpenCode 写稿失败或超时" "$PRIV/opencode.log"
          [ "$S_GATE" = failure ] && item fail gate "✗ 闸门未过：$(cat "$PRIV/gate_step.txt" 2>/dev/null || echo 未知)，没开 PR" "$PRIV/gate.log"
          [ "$S_PR" = failure ] && item fail pr "✗ 推分支 / 开 PR 失败" "$PRIV/push.err" "$PRIV/pr.err"
          if [ "$JOB_STATUS" = failure ] && [ ${#FAILS[@]} -eq 0 ]; then
            item fail other "✗ 其他步骤失败（Setup Python 等），见运行记录"
          fi
          MERGE="$(cat "$PRIV/merge_state" 2>/dev/null)"
          [ "$MERGE" = failed ] && item warn merge "⚠ 自动合并失败（多半是冲突或序号撞号），PR 留着人工处理" "$PRIV/pr.err"
          if [ -s "$PRIV/radar_fail.txt" ] || [ "$S_RADAR" = failure ]; then
            item warn radar "⚠ $(cat "$PRIV/radar_fail.txt" 2>/dev/null || echo 公众号雷达出错，本轮只用官网和 Wowhead)" "$PRIV/wx_radar.log"
          fi
          [ -s "$PRIV/radar_left.txt" ] && item warn radar_left "⚠ $(cat "$PRIV/radar_left.txt")"
          if [ "$S_WM" = failure ] || grep -q '^\[error\]' "$PRIV/watermark.log" 2>/dev/null; then
            grep '^\[error\]' "$PRIV/watermark.log" > "$N/wm.log" 2>/dev/null
            item warn wm "⚠ 部分图片水印处理失败，已用原图（可能仍带水印）" "$N/wm.log"
          fi

          # 新稿：序号 · 标题（正文第一行）
          : > "$N/articles.txt"
          touch "$PRIV/new_articles.txt"
          K=0
          while read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            K=$((K + 1))
            echo "$(basename "$f" | cut -d- -f1) · $(head -n 1 "$f" | sed -E 's/^#+[[:space:]]*//')" >> "$N/articles.txt"
          done < "$PRIV/new_articles.txt"
          cat "$PRIV/cn_summary.txt" "$PRIV/radar_summary.txt" > "$N/context.txt" 2>/dev/null

          T=""; [ -s "$PRIV/t0" ] && T=$(( $(date +%s) - $(cat "$PRIV/t0") ))
          {
            if [ "$FETCH_ONLY" = true ]; then
              echo "只抓材料，结果在加密 artifact 里"
            elif [ "$S_GATE" = success ] || [ -n "$MERGE" ]; then
              case "$MERGE" in
                merged)  [ "$K" -gt 0 ] && echo "**新稿 ${K} 篇**，已自动合并进 main，等服务器推草稿（推成后另有通知）" \
                                         || echo "没有新稿，只更新了雷达账本（已合并）" ;;
                failed)  echo "**新稿 ${K} 篇**，PR 已开，自动合并失败" ;;
                nothing) echo "本轮没有新稿" ;;
                *)       [ "$NO_PR" = true ] && echo "**新稿 ${K} 篇**，只跑不交付：没推分支、没开 PR" ;;
              esac
            fi
            echo "篇数上限 ${MAX_ARTICLES:-默认}${NEWS_ID:+ · 指定新闻 ${NEWS_ID}}${T:+ · 用时 $((T / 60))m$((T % 60))s}"
          } > "$N/summary.md"

          if [ "$JOB_STATUS" = cancelled ]; then
            TITLE="⏹ 文章采集 #${RUN_NO} 被取消（手动取消或超过 300 分钟）"; COLOR=grey
          elif [ ${#FAILS[@]} -gt 0 ]; then
            TITLE="❌ 文章采集 #${RUN_NO} 失败 · ${FAILS[0]#✗ }"; COLOR=red
          elif [ ${#WARNS[@]} -gt 0 ]; then
            TITLE="⚠️ 文章采集 #${RUN_NO}：新稿 ${K} 篇，${#WARNS[@]} 条提醒"; COLOR=orange
          elif [ "$K" -gt 0 ]; then
            TITLE="✅ 文章采集 #${RUN_NO}：新稿 ${K} 篇"; COLOR=green
          else
            TITLE="✅ 文章采集 #${RUN_NO}：本轮没有新稿"; COLOR=green
          fi
          BUTTONS=(--button "运行记录|${RUN_URL}")
          [ -s "$PRIV/pr_url.txt" ] && BUTTONS+=(--button "PR|$(cat "$PRIV/pr_url.txt")")

          if git show HEAD:pipeline/notify.py > "$N/notify.py" 2>/dev/null; then
            python3 "$N/notify.py" --title "$TITLE" --color "$COLOR" \
              --md "$N/summary.md" --text "$N/articles.txt" --text "$N/context.txt" "${ITEMS[@]}" "${BUTTONS[@]}" \
              > "$N/send.log" 2>&1
            RC=$?
          else
            # 没有脚本：只发标题，详情页放运行记录链接
            jq -n --arg t "$TITLE" --arg u "$RUN_URL" \
              '{title: $t, description: "没拼成完整通知（私有仓库 checkout 失败？），点详情看运行记录", content: "[运行记录](\($u))"}' > "$N/msg.json"
            curl -sS -m 20 -H 'Content-Type: application/json' --data-binary @"$N/msg.json" "$NOTIFY_WEBHOOK" > "$N/send.log" 2>&1
            grep -q '"success":true' "$N/send.log"; RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo "已推送企业微信"
          else
            # send.log 里只有 Message Pusher 的返回（它自己的提示或企微 errmsg），不含内容；企微 errmsg 带服务器 IP，遮掉
            WHY="$(grep -oE '"message":"[^"]*"' "$N/send.log" | head -n 1 | sed -E 's/from ip: [^ ,"]+/from ip: ***/')"
            echo "::warning::企业微信推送失败（${WHY:-没有返回信息}；「Webhook 构建规则解析失败」= Message Pusher 里这个 webhook 的规则没配成原样透传）"
          fi
